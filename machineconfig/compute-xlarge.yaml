machine:
  install:
    disk: /dev/sda
    image: factory.talos.dev/nocloud-installer/8da9288269158668418bcaff7eb8f7d1eb1829090021fbf6dba69b15e79811a8:v1.14.2
    grubUseUKICmdline: true
  network:
    hostname: compute-xlarge
    nameservers:
      - 8.8.8.8
      - 8.8.4.4
    interfaces:
      - interface: eth0
        dhcp: false
        addresses:
          - 10.0.0.29/24
        routes:
          - network: 0.0.0.0/0
            gateway: 10.0.0.1
  kernel:
    modules:
      - name: btrfs              
      - name: dm-thin-pool
      - name: nvidia
      - name: nvidia_uvm
      - name: nvidia_drm
      - name: nvidia_modeset
  sysctls:
    net.core.bpf_jit_harden: 1 
  nodeLabels:
    node.mmontes.io/type: compute-xlarge
    nvidia.com/gpu.present: true
  kubelet:
    image: ghcr.io/siderolabs/kubelet:v1.37.1
    nodeIP:
      validSubnets:
        - 10.0.0.29/32
    extraConfig:
      registerNode: true
      registerWithTaints:
        - effect: NoSchedule
          key: node.mmontes.io/type
          value: compute-xlarge
    extraArgs:
      rotate-server-certificates: true
cluster:
  network:
    cni:
      name: none