- op: remove
  path: /machine/install
- op: remove
  path: /machine/install/extensions
- op: remove
  path: /machine/network/hostname
- op: remove
  path: /machine/network/nameservers
- op: remove
  path: /machine/features/stableHostname
- op: remove
  path: /machine/kubelet
- op: remove
  path: /machine/nodeLabels 
- op: remove
  path: /cluster/apiServer
- op: remove
  path: /cluster/controllerManager
- op: remove
  path: /cluster/scheduler
- op: remove
  path: /cluster/proxy
- op: replace
  path: /machine/kubelet/extraConfig/registerWithTaints
  value:
    - effect: NoSchedule
      key: node.mmontes.io/type
      value: compute-large
- op: replace
  path: /machine/network/interfaces/0/routes
  value:
    - network: 0.0.0.0/0
      gateway: 10.0.0.1
- op: replace
  path: /machine/network/nameservers
  value: [8.8.8.8, 8.8.4.4]
- op: replace
  path: /machine/kernel/modules
  value:
    - name: btrfs
    - name: dm-thin-pool
---
machine:
  install:
    $patch: delete
  features:
    stableHostname:
      $patch: delete
  network:
    $patch: delete
  kernel:
    $patch: delete
  nodeLabels:
    $patch: delete
  kubelet:
    $patch: delete
  sysctls:
    $patch: delete
cluster:
  network:
    cni:
      $patch: delete
  apiServer:
    $patch: delete
  controllerManager:
    $patch: delete
  proxy:
    $patch: delete
  scheduler:
    $patch: delete
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
$patch: delete
---
apiVersion: v1alpha1
kind: HostnameConfig
$patch: delete
---
apiVersion: v1alpha1
kind: ResolverConfig
$patch: delete
---
apiVersion: v1alpha1
kind: LinkConfig
name: eth0
$patch: delete
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: btrfs
$patch: delete
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: dm-thin-pool
$patch: delete
---
apiVersion: v1alpha1
kind: KubeNodeConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeletConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeAdmissionControlConfig
name: PodSecurity
$patch: delete
---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
image: registry.k8s.io/kube-apiserver:v1.37.1
$patch: delete
---
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
image: registry.k8s.io/kube-controller-manager:v1.37.1
$patch: delete
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
image: registry.k8s.io/kube-scheduler:v1.37.1
$patch: delete
---
apiVersion: v1alpha1
kind: KubeProxyConfig
image: registry.k8s.io/kube-proxy:v1.37.1
$patch: delete