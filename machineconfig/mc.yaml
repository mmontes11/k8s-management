- op: remove
  path: /machine/install
- op: remove
  path: /machine/install/extensions
- op: remove
  path: /machine/network/hostname
- op: remove
  path: /machine/network/nameservers
- op: remove
  path: /machine/features/stableHostname
- op: remove
  path: /machine/kubelet
- op: remove
  path: /machine/nodeLabels 
- op: remove
  path: /cluster/apiServer
- op: remove
  path: /cluster/controllerManager
- op: remove
  path: /cluster/scheduler
- op: remove
  path: /cluster/proxy
- op: replace
  path: /machine/kubelet/extraConfig/registerWithTaints
  value:
    - effect: NoSchedule
      key: node.mmontes.io/type
      value: compute-large
- op: replace
  path: /machine/network/interfaces/0/routes
  value:
    - network: 0.0.0.0/0
      gateway: 10.0.0.1
- op: replace
  path: /machine/network/nameservers
  value: [8.8.8.8, 8.8.4.4]
- op: replace
  path: /machine/kernel/modules
  value:
    - name: btrfs
    - name: dm-thin-pool