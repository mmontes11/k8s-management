apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: compute-xlarge
spec:
  clusterName: cluster
  replicas: 1
  strategy:
    type: OnDelete
  selector:
    matchLabels:
      node.mmontes.io/name: compute-xlarge
  template:
    metadata:
      labels:
        node.mmontes.io/name: compute-xlarge
    spec:
      clusterName: cluster
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
          kind: TalosConfigTemplate
          name: compute-xlarge
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: ProxmoxMachineTemplate
        name: compute-xlarge
---
apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
kind: TalosConfigTemplate
metadata:
  name: compute-xlarge
spec:
  template:
    spec:
      talosVersion: v1.14 # required by talos bootstrap provider
      generateType: worker
      strategicPatches:
        - |
          machine:
            install:
              disk: /dev/sda
              image: factory.talos.dev/nocloud-installer/3ed15c02833947ae0444f22e5225c772346e48feb70cb508d0b36c175eddd624:v1.14.2
              grubUseUKICmdline: true
            network:
              hostname: compute-xlarge
              nameservers:
                - 8.8.8.8
                - 8.8.4.4
              interfaces:
                - interface: eth0
                  dhcp: false
                  addresses:
                    - 10.0.0.29/24
                  routes:
                    - network: 0.0.0.0/0
                      gateway: 10.0.0.1
            kubelet:
              image: ghcr.io/siderolabs/kubelet:v1.37.0
              nodeIP:
                validSubnets:
                  - 10.0.0.29/32
              extraConfig:
                registerNode: true
                registerWithTaints:
                  - effect: NoSchedule
                    key: node.mmontes.io/type
                    value: compute-xlarge
              extraArgs:
                rotate-server-certificates: "true"
            kernel:
              modules:
                - name: btrfs
                - name: dm-thin-pool
                - name: nvidia
                - name: nvidia_uvm
                - name: nvidia_drm
                - name: nvidia_modeset
            sysctls:
              net.core.bpf_jit_harden: "1"
            nodeLabels:
              node.mmontes.io/type: compute-xlarge
              nvidia.com/gpu.present: "true"
          cluster:
            network:
              cni:
                name: none