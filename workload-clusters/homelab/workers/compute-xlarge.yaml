apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: compute-xlarge
spec:
  clusterName: cluster
  replicas: 1
  strategy:
    type: OnDelete
  selector:
    matchLabels:
      node.mmontes.io/name: compute-xlarge
  template:
    metadata:
      labels:
        node.mmontes.io/name: compute-xlarge
    spec:
      clusterName: cluster
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
          kind: TalosConfigTemplate
          name: compute-xlarge
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: ProxmoxMachineTemplate
        name: compute-xlarge
---
apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
kind: TalosConfigTemplate
metadata:
  name: compute-xlarge
spec:
  template:
    spec:
      talosVersion: v1.14 # required by talos bootstrap provider
      generateType: worker
      strategicPatches:
        - |
          apiVersion: v1alpha1
          kind: UnattendedInstallConfig
          installer:
            image: factory.talos.dev/nocloud-installer/8da9288269158668418bcaff7eb8f7d1eb1829090021fbf6dba69b15e79811a8:v1.14.2
          provisioning:
            diskSelector:
              match: disk.dev_path == "/dev/sda"
          ---
          apiVersion: v1alpha1
          kind: HostnameConfig
          hostname: compute-xlarge
          ---
          apiVersion: v1alpha1
          kind: ResolverConfig
          nameservers:
            - address: 8.8.8.8
            - address: 8.8.4.4
          ---
          apiVersion: v1alpha1
          kind: LinkConfig
          name: eth0
          addresses:
            - address: 10.0.0.29/24
          routes:
            - destination: 0.0.0.0/0
              gateway: 10.0.0.1
          ---
          apiVersion: v1alpha1
          kind: KernelModuleConfig
          name: btrfs
          ---
          apiVersion: v1alpha1
          kind: KernelModuleConfig
          name: dm-thin-pool
          ---
          apiVersion: v1alpha1
          kind: KernelModuleConfig
          name: nvidia
          ---
          apiVersion: v1alpha1
          kind: KernelModuleConfig
          name: nvidia_uvm
          ---
          apiVersion: v1alpha1
          kind: KernelModuleConfig
          name: nvidia_drm
          ---
          apiVersion: v1alpha1
          kind: KernelModuleConfig
          name: nvidia_modeset
          ---
          apiVersion: v1alpha1
          kind: SysctlConfig
          params:
            net.core.bpf_jit_harden: "1"
          ---
          apiVersion: v1alpha1
          kind: KubeNodeConfig
          nodeIP:
            validSubnets:
              - 10.0.0.29/32
          labels:
            node.mmontes.io/type: compute-xlarge
            nvidia.com/gpu.present: "true"
          ---
          apiVersion: v1alpha1
          kind: KubeletConfig
          image: ghcr.io/siderolabs/kubelet:v1.37.1
          config:
            registerNode: true
            serverTLSBootstrap: true
            registerWithTaints:
              - effect: NoSchedule
                key: node.mmontes.io/type
                value: compute-xlarge
          ---
          apiVersion: v1alpha1
          kind: KubeFlannelCNIConfig
          $patch: delete