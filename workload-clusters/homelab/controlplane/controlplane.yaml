apiVersion: controlplane.cluster.x-k8s.io/v1alpha3
kind: TalosControlPlane
metadata:
  name: controlplane
spec:
  # This is updated in place via talosctl. Updating this field leads to a drift with status, resulting in the following error:
  # "Scale up on hold because TalosControlPlane homelab/controlplane is upgrading (\"ControlPlaneIsStable\" preflight check failed"
  version: v1.33.2
  replicas: 1
  rolloutStrategy:
    type: OnDelete
  infrastructureTemplate:
    kind: ProxmoxMachineTemplate
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
    name: controlplane
    namespace: homelab
  controlPlaneConfig:
    controlplane:
      talosVersion: v1.14 # required by talos bootstrap provider
      generateType: controlplane
      strategicPatches:
        - |
          machine:
            install:
              disk: /dev/sda
              image: factory.talos.dev/nocloud-installer/3ed15c02833947ae0444f22e5225c772346e48feb70cb508d0b36c175eddd624:v1.14.2
              grubUseUKICmdline: true
            network:
              hostname: controlplane
              nameservers:
                - 8.8.8.8
                - 8.8.4.4
              interfaces:
                - interface: eth0
                  dhcp: false
                  addresses:
                    - 10.0.0.12/24
                  routes:
                    - network: 0.0.0.0/0
                      gateway: 10.0.0.1
            kubelet:
              image: ghcr.io/siderolabs/kubelet:v1.37.1
              nodeIP:
                validSubnets:
                  - 10.0.0.12/32
              extraConfig:
                registerNode: true
              extraArgs:
                rotate-server-certificates: true
          cluster:
            network:
              cni:
                name: none
            apiServer:
              image: registry.k8s.io/kube-apiserver:v1.37.1
              disablePodSecurityPolicy: true
              admissionControl: []
            controllerManager:
              image: registry.k8s.io/kube-controller-manager:v1.37.1
              extraArgs:
                bind-address: "0.0.0.0"
                secure-port: "10257"
            scheduler:
              image: registry.k8s.io/kube-scheduler:v1.37.1
              extraArgs:
                bind-address: "0.0.0.0"
                secure-port: "10259"
            proxy:
              image: registry.k8s.io/kube-proxy:v1.37.1
              extraArgs:
                metrics-bind-address: "0.0.0.0:10249"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ProxmoxMachineTemplate
metadata:
  name: controlplane
spec:
  template:
    spec:
      disks:
        bootVolume:
          disk: scsi0
          sizeGb: 20
      format: qcow2
      full: true
      memoryMiB: 8192
      network:
        default:
          bridge: vmbr0
          model: virtio
      numCores: 4
      numSockets: 1
      sourceNode: proxmox
      templateID: 102
      checks:
        skipCloudInitStatus: true