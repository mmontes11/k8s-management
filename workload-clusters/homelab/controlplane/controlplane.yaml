apiVersion: controlplane.cluster.x-k8s.io/v1alpha3
kind: TalosControlPlane
metadata:
  name: controlplane
spec:
  # This is updated in place via talosctl. Updating this field leads to a drift with status, resulting in the following error:
  # "Scale up on hold because TalosControlPlane homelab/controlplane is upgrading (\"ControlPlaneIsStable\" preflight check failed"
  version: v1.33.2
  replicas: 1
  rolloutStrategy:
    type: OnDelete
  infrastructureTemplate:
    kind: ProxmoxMachineTemplate
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
    name: controlplane
    namespace: homelab
  controlPlaneConfig:
    controlplane:
      talosVersion: v1.14 # required by talos bootstrap provider
      generateType: controlplane
      strategicPatches:
        - |
          apiVersion: v1alpha1
          kind: UnattendedInstallConfig
          installer:
            image: factory.talos.dev/nocloud-installer/3ed15c02833947ae0444f22e5225c772346e48feb70cb508d0b36c175eddd624:v1.14.2
          provisioning:
            diskSelector:
              match: disk.dev_path == "/dev/sda"
          ---
          apiVersion: v1alpha1
          kind: HostnameConfig
          auto: off
          hostname: controlplane
          ---
          apiVersion: v1alpha1
          kind: ResolverConfig
          nameservers:
            - address: 8.8.8.8
            - address: 8.8.4.4
          ---
          apiVersion: v1alpha1
          kind: LinkConfig
          name: eth0
          addresses:
            - address: 10.0.0.12/24
          routes:
            - gateway: 10.0.0.1
          ---
          apiVersion: v1alpha1
          kind: KubeNodeConfig
          nodeIP:
            validSubnets:
              - 10.0.0.12/32
          labels:
            node-role.kubernetes.io/control-plane: ""
          taints:
            node-role.kubernetes.io/control-plane: ":NoSchedule"
          ---
          apiVersion: v1alpha1
          kind: KubeletConfig
          image: ghcr.io/siderolabs/kubelet:v1.37.1
          config:
            registerNode: true
            serverTLSBootstrap: true
          ---
          apiVersion: v1alpha1
          kind: KubeFlannelCNIConfig
          $patch: delete
          ---
          apiVersion: v1alpha1
          kind: KubeAdmissionControlConfig
          name: PodSecurity
          $patch: delete
          ---
          apiVersion: v1alpha1
          kind: KubeAPIServerConfig
          image: registry.k8s.io/kube-apiserver:v1.37.1
          ---
          apiVersion: v1alpha1
          kind: KubeControllerManagerConfig
          image: registry.k8s.io/kube-controller-manager:v1.37.1
          extraArgs:
            bind-address: "0.0.0.0"
            secure-port: "10257"
          ---
          apiVersion: v1alpha1
          kind: KubeSchedulerConfig
          image: registry.k8s.io/kube-scheduler:v1.37.1
          extraArgs:
            bind-address: "0.0.0.0"
            secure-port: "10259"
          ---
          apiVersion: v1alpha1
          kind: KubeProxyConfig
          image: registry.k8s.io/kube-proxy:v1.37.1
          config:
            metricsBindAddress: 0.0.0.0:10249
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ProxmoxMachineTemplate
metadata:
  name: controlplane
spec:
  template:
    spec:
      disks:
        bootVolume:
          disk: scsi0
          sizeGb: 20
      format: qcow2
      full: true
      memoryMiB: 8192
      network:
        default:
          bridge: vmbr0
          model: virtio
      numCores: 4
      numSockets: 1
      sourceNode: proxmox
      templateID: 102
      checks:
        skipCloudInitStatus: true